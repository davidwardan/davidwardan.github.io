# Default (production) settings
baseURL = "https://davidwardan.github.io/"
languageCode = 'en-us'
title = "David's Blog"
theme = 'PaperMod'
relativeURLs = true
canonifyURLs = true 

[params]
  defaultTheme = "auto"
  env = "production"
  math = true 

  [params.profileMode]
    enabled = true
    title = "Hi, I'm David."
    subtitle = "Machine Learning Engineer & Researcher."
    imageUrl = "images/profile.png"
    imageWidth = 200
    imageHeight = 200
    imageTitle = "David Wardan"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/davidwardan"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/david-wardan/"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/davidwardan"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:wardandavid@gmail.com"

[services]
  [services.googleAnalytics]
    id = 'G-7VRWL6E41Q'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[[menu.main]]
  name = "Research"
  url = "/research/"
  weight = 1

[[menu.main]]
  name = "Building"
  url = "/building/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3