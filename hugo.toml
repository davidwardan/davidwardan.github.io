baseURL = 'https://davidwardan.github.io/davidwardan.github.io/'
languageCode = 'en-us'
title = "David's Blog"
theme = 'PaperMod'
relativeURLs = true

[params]
  defaultTheme = "auto"

  [params.profileMode]
    enabled = true
    title = "👋 Hello, Early Visitor!"
    subtitle = "You've arrived early—like, really early. Come back in a month or two while I figure out how to build this thing!"
    imageUrl = "images/profile.png"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "David Wardan"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/davidwardan"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/david-wardan/"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/davidwardan"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:wardandavid@gmail.com"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 3